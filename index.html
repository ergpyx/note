<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daftar Game</title>
<style>
:root{
  --bg:#f6f7f9; --card:#fff; --ink:#18202b; --muted:#7a8494; --line:#e4e7ec;
  --accent:#4f46e5; --accent2:#7c3aed; --danger:#e5484d;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1218;--card:#181d26;--ink:#eef1f6;--muted:#8b95a5;--line:#262d39;--accent:#6d7bff;--accent2:#a78bfa;--danger:#ff7b80}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:32px 16px 64px}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
h1{font-size:1.6rem;margin:0;font-weight:700}
.bk{display:flex;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:.82rem;cursor:pointer}
.pill:hover{border-color:var(--accent);color:var(--accent)}
.pill svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;grid-template-columns:1fr 1fr}
.form .nama{grid-column:1/-1}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;min-width:0}
input::placeholder{color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
label{display:block;font-size:.78rem;color:var(--muted);margin:0 0 3px 2px}
.btn{grid-column:1/-1;display:flex;gap:8px}
.add{flex:1;border:0;border-radius:10px;padding:12px 18px;font:inherit;font-weight:600;color:#fff;cursor:pointer;
  background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 4px 14px rgba(79,70,229,.3);
  transition:transform .12s,box-shadow .12s}
.add:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(79,70,229,.4)}
.add:active{transform:translateY(0)}
.cancel{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:12px 16px;font:inherit;cursor:pointer}

.tools{display:flex;gap:10px;margin:20px 0 10px}
.tools input{flex:1}
.tools select{width:auto}

.list{margin:0;padding:0;list-style:none;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:.92rem}
.list>li:last-child{border-bottom:0}
.item:hover{background:var(--bg)}
.name{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ver,.date{color:var(--muted);font-size:.82rem;white-space:nowrap}
button.ver{border:0;background:transparent;font:inherit;font-size:.82rem;padding:2px 6px;border-radius:6px;cursor:pointer;min-width:38px;text-align:right}
button.ver.has{color:var(--accent);text-decoration:underline dotted;text-underline-offset:3px}
button.ver:hover{background:var(--line)}
.icon{display:inline-flex;border:0;background:transparent;color:var(--muted);cursor:pointer;padding:5px;border-radius:7px}
.icon svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon:hover{background:var(--line);color:var(--ink)}
.icon.del:hover{color:var(--danger)}
.hist{list-style:none;margin:0;padding:6px 12px 8px 24px;background:var(--bg);border-bottom:1px solid var(--line);font-size:.82rem;color:var(--muted)}
.hist div{display:flex;justify-content:space-between;padding:2px 0}
.hist b{color:var(--ink);font-weight:600}
.empty{text-align:center;color:var(--muted);padding:24px 0}
mark{background:#ffe27a;color:#222;border-radius:3px}
.note{color:var(--muted);font-size:.78rem;margin-top:14px;text-align:center}
textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;resize:vertical;min-height:64px}
textarea::placeholder{color:var(--muted)}
.full{grid-column:1/-1}
.stars{display:flex;gap:2px;align-items:center;height:44px}
.stars button{border:0;background:transparent;cursor:pointer;padding:2px;font-size:1.5rem;line-height:1;color:var(--line)}
.stars button.on{color:#f5b301}
.favbtn{display:flex;align-items:center;gap:8px;height:44px;width:100%;border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:10px;padding:0 12px;font:inherit;font-size:.9rem;cursor:pointer}
.favbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.favbtn.on{color:var(--danger);border-color:var(--danger)}
.favbtn.on svg,.icon.fav.on svg{fill:currentColor}
.icon.fav.on{color:var(--danger)}
.rate{color:#f5b301;font-size:.82rem;white-space:nowrap;min-width:28px;text-align:right}
.rate.none{color:var(--line)}
.kesan{white-space:pre-wrap;word-break:break-word;color:var(--ink);margin:0 0 6px;padding-bottom:6px;border-bottom:1px dashed var(--line)}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:6px;vertical-align:middle}
.chip{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:10px;padding:0 12px;font:inherit;cursor:pointer;white-space:nowrap}
.chip.on{color:var(--danger);border-color:var(--danger)}
@media (max-width:420px){.form{grid-template-columns:1fr}.date{font-size:.75rem}.rate{min-width:0}.item{gap:6px;padding:8px}.pill span{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>Daftar Game</h1>
    <div class="bk">
      <button class="pill" id="ekspor" title="Simpan cadangan ke file">
        <svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg><span>Ekspor</span>
      </button>
      <button class="pill" id="impor" title="Muat cadangan dari file">
        <svg viewBox="0 0 24 24"><path d="M12 15V3"/><path d="M7 8l5-5 5 5"/><path d="M5 21h14"/></svg><span>Impor</span>
      </button>
      <input id="file" type="file" accept=".json,application/json" hidden>
    </div>
  </div>

  <div class="form">
    <div class="nama">
      <input id="nama" placeholder="Nama game" autocomplete="off" aria-label="Nama game">
    </div>
    <div>
      <label for="versi">Versi</label>
      <input id="versi" placeholder="mis. 1.0.3">
    </div>
    <div>
      <label for="tgl">Terakhir dimainkan</label>
      <input id="tgl" type="date">
    </div>
    <div>
      <label>Rating</label>
      <div class="stars" id="stars"></div>
    </div>
    <div>
      <label>Penanda</label>
      <button type="button" class="favbtn" id="favbtn"><svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 00-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 000-7.8z"/></svg><span>Menunggu update</span></button>
    </div>
    <div class="full">
      <label for="kesan">Catatan / kesan</label>
      <textarea id="kesan" placeholder="Kesan setelah main, bagian favorit, kekurangan..."></textarea>
    </div>
    <div class="btn">
      <button class="add" id="simpan">Tambah game</button>
      <button class="cancel" id="batal" hidden>Batal</button>
    </div>
  </div>

  <div class="tools">
    <input id="cari" type="search" placeholder="Cari game..." aria-label="Cari game">
    <button class="chip" id="filterFav" title="Tampilkan yang menunggu update">♥ Favorit</button>
    <select id="urut" aria-label="Urutkan">
      <option value="az">A–Z</option>
      <option value="za">Z–A</option>
      <option value="baru">Terbaru</option>
      <option value="lama">Terlama</option>
      <option value="rating">Rating tertinggi</option>
    </select>
  </div>

  <ul class="list" id="daftar"></ul>
  <p class="note">Klik nama atau versi untuk melihat catatan dan riwayat. ♥ = menunggu update. Ekspor cadangan sebelum mengganti kode.</p>
</div>

<script>
const KEY="daftar_game_v2";   // jangan diubah supaya data lama tetap terbaca
let data=[], editId=null, rating=0, fav=false, onlyFav=false;
const open=new Set();
const $=id=>document.getElementById(id);
const nama=$("nama"),versi=$("versi"),tgl=$("tgl"),kesan=$("kesan"),favbtn=$("favbtn"),starsEl=$("stars"),filterFav=$("filterFav"),simpan=$("simpan"),batal=$("batal"),cari=$("cari"),urut=$("urut"),daftar=$("daftar"),file=$("file");

/* data lama tanpa riwayat tetap aman: riwayat dibuat otomatis */
function normalize(arr){
  return (Array.isArray(arr)?arr:[]).filter(g=>g&&typeof g.nama==="string").map(g=>{
    const o={id:Number(g.id)||Date.now()+Math.random(),nama:g.nama,versi:g.versi||"",tgl:g.tgl||""};
    o.rating=Math.max(0,Math.min(5,Math.round(Number(g.rating))||0));
    o.fav=!!g.fav;o.kesan=typeof g.kesan==="string"?g.kesan:"";
    o.history=Array.isArray(g.history)?g.history.filter(h=>h&&h.versi).map(h=>({versi:String(h.versi),tgl:h.tgl||""})):[];
    if(!o.history.length&&o.versi)o.history=[{versi:o.versi,tgl:o.tgl}];
    return o;
  });
}
function load(){try{data=normalize(JSON.parse(localStorage.getItem(KEY)))}catch(e){data=[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert("Gagal menyimpan.")}}
function hariIni(){const d=new Date(),p=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())}
function fmt(s){if(!s)return "-";const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"2-digit"})}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function hl(t,q){const s=esc(t);if(!q)return s;return s.replace(new RegExp("("+esc(q).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi"),"<mark>$1</mark>")}

const ICO_EDIT='<svg viewBox="0 0 24 24" style="pointer-events:none"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>';
const ICO_FAV='<svg viewBox="0 0 24 24" style="pointer-events:none"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 00-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 000-7.8z"/></svg>';
const ICO_DEL='<svg viewBox="0 0 24 24" style="pointer-events:none"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>';

function render(){
  const q=cari.value.trim().toLowerCase();
  const l=data.filter(g=>(!onlyFav||g.fav)&&(!q||g.nama.toLowerCase().includes(q)||g.versi.toLowerCase().includes(q)||g.kesan.toLowerCase().includes(q)));
  const m=urut.value;
  l.sort((a,b)=>{
    if(m==="az")return a.nama.localeCompare(b.nama,"id",{sensitivity:"base"});
    if(m==="za")return b.nama.localeCompare(a.nama,"id",{sensitivity:"base"});
    if(m==="baru")return b.tgl.localeCompare(a.tgl);
    if(m==="rating")return b.rating-a.rating||a.nama.localeCompare(b.nama,"id",{sensitivity:"base"});
    return a.tgl.localeCompare(b.tgl);
  });
  if(!l.length){daftar.innerHTML='<li class="empty">'+(data.length?"Tidak ditemukan.":"Belum ada game. Tambahkan di atas.")+'</li>';return}
  daftar.innerHTML=l.map(g=>{
    const has=g.history.length>0;
    let h="";
    if(open.has(g.id)){
      h='<li class="hist">'+(g.kesan?'<p class="kesan">'+hl(g.kesan,q)+'</p>':"")+(has?[...g.history].reverse().map(x=>`<div><b>v${esc(x.versi)}</b><span>${fmt(x.tgl)}</span></div>`).join(""):"<div>Belum ada riwayat versi.</div>")+'</li>';
    }
    return `<li class="item">
      <span class="name" data-hist="${g.id}" style="cursor:pointer" title="${esc(g.nama)}">${hl(g.nama,q)}${g.kesan?'<i class="dot" title="Ada catatan"></i>':""}</span>
      <span class="rate ${g.rating?"":"none"}">${g.rating?"★"+g.rating:"–"}</span>
      <button class="ver ${g.history.length>1?"has":""}" data-hist="${g.id}" title="Riwayat versi">${g.versi?"v"+hl(g.versi,q):"–"}</button>
      <span class="date">${fmt(g.tgl)}</span>
      <button class="icon fav ${g.fav?"on":""}" data-fav="${g.id}" title="${g.fav?"Menunggu update (klik untuk lepas)":"Tandai menunggu update"}" aria-label="Favorit">${ICO_FAV}</button>
      <button class="icon" data-edit="${g.id}" title="Edit" aria-label="Edit">${ICO_EDIT}</button>
      <button class="icon del" data-del="${g.id}" title="Hapus" aria-label="Hapus">${ICO_DEL}</button>
    </li>${h}`;
  }).join("");
}

function drawStars(){starsEl.innerHTML=[1,2,3,4,5].map(n=>`<button type="button" data-n="${n}" class="${n<=rating?"on":""}" aria-label="${n} bintang">★</button>`).join("")}
function drawFav(){favbtn.classList.toggle("on",fav)}
starsEl.onclick=e=>{const b=e.target.closest("button,[data-hist]");if(!b)return;const n=+b.dataset.n;rating=(rating===n)?0:n;drawStars()};
favbtn.onclick=()=>{fav=!fav;drawFav()};
filterFav.onclick=()=>{onlyFav=!onlyFav;filterFav.classList.toggle("on",onlyFav);render()};
function reset(){rating=0;fav=false;kesan.value="";drawStars();drawFav();editId=null;nama.value="";versi.value="";tgl.value=hariIni();simpan.textContent="Tambah game";batal.hidden=true}

simpan.onclick=()=>{
  const n=nama.value.trim();
  if(!n){nama.focus();return}
  const v=versi.value.trim().replace(/^v/i,""), t=tgl.value||hariIni();
  if(editId!==null){
    const g=data.find(x=>x.id===editId);
    if(g){
      g.nama=n;g.versi=v;g.tgl=t;g.rating=rating;g.fav=fav;g.kesan=kesan.value.trim();
      const last=g.history[g.history.length-1];
      if(v&&(!last||last.versi!==v))g.history.push({versi:v,tgl:t});   // versi berubah → catat riwayat
    }
  }else{
    data.push({id:Date.now(),nama:n,versi:v,tgl:t,rating,fav,kesan:kesan.value.trim(),history:v?[{versi:v,tgl:t}]:[]});
  }
  save();reset();render();
};
batal.onclick=reset;
[nama,versi].forEach(i=>i.addEventListener("keydown",e=>{if(e.key==="Enter")simpan.click()}));

daftar.onclick=e=>{
  const b=e.target.closest("button");if(!b)return;
  const d=b.dataset.del,ed=b.dataset.edit,hi=b.dataset.hist,fv=b.dataset.fav;
  if(fv){const g=data.find(x=>x.id===+fv);if(g){g.fav=!g.fav;save();render()}}
  if(hi){const id=+hi;open.has(id)?open.delete(id):open.add(id);render()}
  if(d){const g=data.find(x=>x.id===+d);if(g&&confirm('Hapus "'+g.nama+'"?')){data=data.filter(x=>x.id!==g.id);open.delete(g.id);if(editId===g.id)reset();save();render()}}
  if(ed){const g=data.find(x=>x.id===+ed);if(!g)return;editId=g.id;nama.value=g.nama;versi.value=g.versi;tgl.value=g.tgl;rating=g.rating;fav=g.fav;kesan.value=g.kesan;drawStars();drawFav();simpan.textContent="Simpan perubahan";batal.hidden=false;nama.focus();window.scrollTo({top:0,behavior:"smooth"})}
};
cari.oninput=render;urut.onchange=render;

/* ---------- Ekspor / Impor ---------- */
$("ekspor").onclick=()=>{
  if(!data.length){alert("Belum ada data untuk diekspor.");return}
  const isi=JSON.stringify({app:"daftar-game",format:1,exported:new Date().toISOString(),data},null,2);
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([isi],{type:"application/json"}));
  a.download="daftar-game-"+hariIni()+".json";
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};
$("impor").onclick=()=>file.click();
file.onchange=()=>{
  const f=file.files[0];file.value="";if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    let masuk;
    try{
      const j=JSON.parse(r.result);
      masuk=normalize(Array.isArray(j)?j:j.data);
    }catch(e){alert("File tidak valid. Pilih file cadangan .json dari aplikasi ini.");return}
    if(!masuk.length){alert("File tidak berisi data game.");return}
    const gabung=confirm("Ditemukan "+masuk.length+" game.\n\nOK = Gabungkan dengan data sekarang\nBatal = Pilih opsi lain");
    let mode=null;
    if(gabung)mode="gabung";
    else if(confirm("Ganti SEMUA data sekarang dengan isi file ini?\n\nOK = Ganti semua\nBatal = Batalkan impor"))mode="ganti";
    if(!mode)return;
    try{localStorage.setItem(KEY+"_backup",JSON.stringify(data))}catch(e){}   // cadangan otomatis sebelum impor
    if(mode==="ganti")data=masuk;
    else{
      masuk.forEach(g=>{
        const i=data.findIndex(x=>x.id===g.id||x.nama.toLowerCase()===g.nama.toLowerCase());
        if(i>=0)data[i]={...g,id:data[i].id};else data.push(g);
      });
    }
    save();reset();render();
    alert("Impor selesai. Total sekarang: "+data.length+" game.");
  };
  r.readAsText(f);
};

load();reset();render();
</script>
</body>
</html>
